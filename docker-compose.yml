version: '3.8'
services:
  web:
    build: .
    ports:
      - "8002:8002"
    environment:
      - OMNIROUTE_BASE_URL=${OMNIROUTE_BASE_URL}
      - OMNIROUTE_API_KEY=${OMNIROUTE_API_KEY}
      - OMNIROUTE_DEFAULT_MODEL=${OMNIROUTE_DEFAULT_MODEL}
      - DJANGO_SECRET_KEY=${DJANGO_SECRET_KEY}
      - DJANGO_DEBUG=${DJANGO_DEBUG}
    volumes:
      - .:/app
    command: python -X utf8 manage.py runserver 0.0.0.0:8002
